version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: bible_api_opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: bible_api_opensearch_dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bible_api_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  bible_api:
    build: .
    container_name: bible_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=kjv_v2
      - OPENSEARCH_SYNONYMS_SET=kjv_synonyms
      - GOOGLE_CLIENT_ID=1087565480706-8ntgu6rrcbpfmtnlqd2pair903q664v5.apps.googleusercontent.com
      - JWT_SECRET=change_me
      - INTERNAL_TOKEN_SECRET=change_me
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch_data:
  redis_data:
