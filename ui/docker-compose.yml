services:
  bible_ui:
    image: node:20-alpine
    container_name: bible_api_ui
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
